INHERIT: config/base.yml
site_name: Документация A-Faction
site_description: "Как пользоваться A-Faction: панель управления и Discord-бот для сообществ."
extra:
  footer:
    home: https://a-faction.xyz
    tagline: Документация CRM и Discord-бота для сообществ — как всё устроено и что делать, если что-то не работает.
    made_by: Сделано
    to_top: Наверх
    columns:
      - title: Документация
        links:
          - { title: Начало работы, url: start/ }
          - { title: Работа с составом, url: work/ }
          - { title: Настройки сервера, url: settings/ }
          - { title: Все ошибки и решения, url: help/troubleshooting/ }
      - title: A-Faction
        links:
          - { title: Сайт, href: "https://a-faction.xyz" }
          - { title: Панель управления, href: "https://crm.a-faction.xyz" }
          - { title: Статус, href: "https://status.a-faction.xyz" }
          - { title: Что нового, href: "https://a-faction.xyz/changelog" }
      - title: Сообщество
        links:
          - { title: Discord, href: "https://discord.gg/2cMBp8gjYn" }
          - { title: GitHub, href: "https://github.com/a-faction/docs" }
          - { title: Поддержка, url: help/support/ }
docs_dir: content/ru
site_dir: site

theme:
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

plugins:
  - search:
      lang: [ru, en]

nav:
  - Главная: index.md
  - Начало работы:
      - start/index.md
      - "Подключить сервер": start/connect-server.md
      - "Добавить бота": start/connect-bot.md
      - "Первая настройка": start/first-steps.md
      - "Вход и устройства": start/login.md
      - "Как устроена панель": start/interface.md
      - "Приложение": start/desktop.md
  - Работа с составом:
      - work/index.md
      - "Участники и регистрация": work/members.md
      - "Профиль участника": work/profile.md
      - "Выговоры": work/reprimands.md
      - "Снятие выговоров": work/appeals.md
      - "Неактив": work/inactive.md
      - "Отчётность": work/reports.md
      - "Коины": work/coins.md
      - "Собеседования": work/interviews.md
      - "Планировщик": work/planner.md
      - "Чёрные списки": work/blacklist.md
      - "Формы и анкеты": work/forms.md
      - "Документы": work/documents.md
      - "Архив и журнал": work/archive-logs.md
      - "Экспорт состава": work/export.md
  - Discord:
      - discord/index.md
      - "Команды бота": discord/commands.md
      - "Формы Discord": discord/discord-forms.md
      - "Сообщения от бота": discord/webhooks.md
  - Настройки сервера:
      - settings/index.md
      - "Обзор": settings/overview.md
      - "Структура": settings/structure.md
      - "Права и доступ": settings/access.md
      - "Старшинство": settings/hierarchy.md
      - "Таблица участников": settings/table.md
      - "Настройка выговоров": settings/reprimands.md
      - "Настройка планировщика": settings/planner.md
      - "Уведомления и автоматизации": settings/notifications.md
      - "Пресеты и названия": settings/presets.md
      - "Настройка словами": settings/ai-setup.md
  - Мой аккаунт:
      - account/index.md
      - "Личные настройки": account/settings.md
      - "Приватность": account/privacy.md
      - "Premium": account/premium.md
  - Помощь:
      - help/index.md
      - "Все ошибки и решения": help/troubleshooting.md
      - "Частые вопросы": help/faq.md
      - "A-Faction AI": help/ai.md
      - "Поддержка": help/support.md
      - "Статус сервисов": help/status.md
      - "Словарь": help/glossary.md
